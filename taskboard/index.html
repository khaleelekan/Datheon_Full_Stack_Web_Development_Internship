<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">
<meta name="description" content="A fast, private task board that works offline.">
<title>Taskboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">

  <header class="head">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Taskboard</h1>
        <p class="sub">Plan it. Tick it off. Stays in your browser.</p>
      </div>
    </div>

    <div class="head-actions">
      <button type="button" id="themeBtn" class="icon-btn"
              aria-label="Theme: auto. Click to change." title="Theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
      <div class="menu-wrap">
        <button type="button" id="menuBtn" class="icon-btn"
                aria-haspopup="menu" aria-expanded="false"
                aria-controls="menu" aria-label="More options">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="5"  cy="12" r="1.7" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
            <circle cx="19" cy="12" r="1.7" fill="currentColor"/>
          </svg>
        </button>
        <div id="menu" class="menu" role="menu" hidden>
          <button type="button" role="menuitem" id="exportBtn">Export tasks</button>
          <button type="button" role="menuitem" id="importBtn">Import tasks</button>
        </div>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <main>
    <form id="addForm" class="add" autocomplete="off" novalidate>
      <div class="add-main">
        <label class="sr-only" for="text">New task</label>
        <input id="text" type="text" placeholder="What needs doing?" maxlength="200" required>
        <button type="submit" class="primary">Add</button>
      </div>
      <div class="add-meta">
        <label class="field">
          <span>Category</span>
          <div class="select-wrap"><select id="cat"></select></div>
        </label>
        <label class="field">
          <span>Priority</span>
          <div class="select-wrap"><select id="prio"></select></div>
        </label>
        <label class="field">
          <span>Due</span>
          <input type="date" id="due">
        </label>
      </div>
    </form>

    <section class="toolbar" aria-label="Task controls">
      <div class="seg" role="group" aria-label="Filter by status">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" aria-pressed="false">Done</button>
      </div>
      <div class="toolbar-right">
        <label class="sr-only" for="catFilter">Filter by category</label>
        <div class="select-wrap"><select id="catFilter"></select></div>

        <label class="sr-only" for="sortBy">Sort tasks</label>
        <div class="select-wrap">
          <select id="sortBy">
            <option value="manual">Manual</option>
            <option value="due">Due date</option>
            <option value="priority">Priority</option>
            <option value="created">Newest</option>
          </select>
        </div>

        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
          </svg>
          <label class="sr-only" for="search">Search tasks</label>
          <input id="search" type="search" placeholder="Search…">
        </div>
      </div>
    </section>

    <ul id="list" class="list" aria-label="Tasks"></ul>

    <footer class="foot">
      <span id="count" class="count" aria-live="polite"></span>
      <button type="button" id="clearBtn" class="link-btn" hidden>Clear completed</button>
    </footer>
  </main>

</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo" class="toast-undo" hidden>Undo</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
